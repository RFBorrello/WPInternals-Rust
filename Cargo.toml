[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop"]
exclude = ["vendor/ntfs"]
default-members = ["crates/wpi-cli", "crates/wpi-core", "crates/wpi-image", "crates/wpi-protocol", "crates/wpi-transport", "crates/wpi-types"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
crc32fast = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
quick-xml = { version = "0.38", features = ["serialize"] }
nusb = "0.2.7"
wpi-types = { path = "crates/wpi-types" }
wpi-image = { path = "crates/wpi-image" }
wpi-protocol = { path = "crates/wpi-protocol" }
wpi-core = { path = "crates/wpi-core" }
wpi-transport = { path = "crates/wpi-transport" }

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
ntfs = { path = "vendor/ntfs" }
