name: Prepare development packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm --prefix apps/ui ci
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked --no-default-features --root .tools
      - run: cargo test --locked
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: SHA-256 manifest
        shell: bash
        run: find target/release/bundle -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec node scripts/checksums.mjs {} + > target/release/bundle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-development-${{ matrix.target }}
          path: target/release/bundle
          if-no-files-found: error
