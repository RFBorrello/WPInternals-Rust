[package]
name = "wpi-cli"
default-run = "wpi"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wpi"
path = "src/main.rs"

[[bin]]
name = "wpi-gpt-recovery"
path = "src/recovery.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5.2"
serde.workspace = true
serde_json.workspace = true
wpi-types.workspace = true
wpi-protocol.workspace = true
wpi-image.workspace = true
wpi-core.workspace = true
wpi-transport.workspace = true
wpi-storage = { path = "../wpi-storage" }
