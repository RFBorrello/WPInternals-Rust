[package]
name = "wpi-image"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
crc32fast.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
quick-xml.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cms = "0.2.3"
der = { version = "0.7", features = ["alloc", "derive", "oid"] }
x509-cert = "0.2.5"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
ntfs = "0.4"
lzma-rs = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# RSA public verification does not request randomness; rand's linked backend still
# needs its browser configuration to compile on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
